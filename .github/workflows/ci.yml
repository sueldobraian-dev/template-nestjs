name: CI & Template Usage Check

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: npm ci

      - name: Run Build
        run: npm run build

      - name: Run Tests
        run: npm test

      - name: Author Notification Banner
        run: |
          echo "=========================================================="
          echo "🚀 Template NestJS CQRS + Scalar"
          echo "👨‍💻 Creado por: Braian Sueldo (Sarasa Dev)"
          echo "🔗 LinkedIn: https://www.linkedin.com/in/braian-sueldo"
          echo "🐙 GitHub: @sueldobraian-dev"
          echo "=========================================================="
